# Opt-in overlay after provision of the broker URI and owner/consumer topology.
services:
  billing-service:
    environment:
      BILLING_OUTBOX_RELAY_ENABLED: "true"
      BILLING_RABBITMQ_URI_FILE: /run/billing-rabbitmq/uri
    volumes:
      - type: bind
        source: ${BILLING_RABBITMQ_SECRETS_DIR:?Set the private broker credential directory}
        target: /run/billing-rabbitmq
        read_only: true
